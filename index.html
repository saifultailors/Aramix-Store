<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সফটওয়্যার স্টোর</title>
<style>
:root{--ink:#10302a;--ink-soft:#4b625c;--paper:#f4f7f5;--line:#dbe5e0;--action:#0b57d0;--action-dark:#0842a0}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush','Nikosh',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--action);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1}
.back{width:40px;height:40px;border-radius:50%;display:none;align-items:center;justify-content:center}
.back:hover{background:#e3ece8}
.back svg{width:24px;height:24px}
.search{max-width:720px;margin:10px auto 0;display:block}
.search input{width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink)}
body.detail .back{display:flex}
body.detail .search{display:none}
.sec{margin-top:26px}
.sec-head{margin-bottom:12px}
.sec-head h2{font-size:19px;font-weight:700}
.rail{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 96px;text-align:left;scroll-snap-align:start}
.tile .ico{width:96px;height:96px;border-radius:22px}
.tile .nm{margin-top:8px;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .sz{font-size:13px;color:var(--ink-soft)}
.rowlist{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .pos{width:18px;color:var(--ink-soft);font-size:15px;text-align:center}
.row .ico{width:56px;height:56px;border-radius:14px;flex:none}
.row .t{font-weight:600;font-size:16px}
.row .m{font-size:13px;color:var(--ink-soft)}
.ico{position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;background:#0f766e}
.ico span{font-size:40px;line-height:1}
.row .ico span{font-size:24px}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.d-top{display:flex;gap:18px;align-items:flex-start;margin-top:22px}
.d-top .ico{width:88px;height:88px;border-radius:22px;flex:none}
.d-top h1{font-size:26px;line-height:1.25;font-weight:700}
.d-top .dev{color:var(--action);font-weight:600;margin-top:2px}
.facts{display:flex;margin:22px 0;padding:6px 0;border-block:1px solid var(--line)}
.fact{flex:1;text-align:center;padding:8px 4px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font-size:16px}
.fact small{font-size:12.5px;color:var(--ink-soft)}
.install{width:100%;padding:13px;border-radius:999px;background:var(--action);color:#fff;font-weight:600;font-size:17px;position:relative;overflow:hidden;transition:background .15s}
.install:hover{background:var(--action-dark)}
.install .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--action-dark)}
.install .lbl{position:relative}
.install[disabled]{cursor:default}
.note{font-size:13px;color:var(--ink-soft);margin-top:8px;text-align:center}
.shots{display:flex;gap:12px;overflow-x:auto;margin:26px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shot-img{flex:0 0 auto;height:356px;width:auto;max-width:78vw;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:zoom-in;object-fit:cover}
.about{margin-top:28px}
.about h2{font-size:19px;margin-bottom:8px}
.about p{color:var(--ink-soft);font-size:16px;max-width:62ch;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:14px}
.empty{padding:48px 0;color:var(--ink-soft);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;max-width:88vw;opacity:0;pointer-events:none;transition:.25s;font-size:15px;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
.lb{position:fixed;inset:0;background:rgba(8,20,17,.92);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.lb button{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:#ffffff22;color:#fff;font-size:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="back" id="back" aria-label="পেছনে যান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="brand">সফটওয়্যার স্টোর</div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="সফটওয়্যার খুঁজুন" aria-label="সফটওয়্যার খুঁজুন"></div>
</header>
<main class="wrap" id="app"><p class="empty">লোড হচ্ছে…</p></main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#0f766e","#b4232a","#5b3fa6","#c2570c","#0b57d0","#1d6b3a","#9b2c6f","#44546a"];
const colorOf = a => COLORS[[...a.id].reduce((s,c)=>s+c.charCodeAt(0),0)%COLORS.length];

let APPS=[];

if(SUPABASE_URL.includes("YOUR-PROJECT")){
  app.innerHTML='<p class="empty">সেটআপ বাকি আছে। config.js ফাইলে Supabase URL ও Key বসান (README.txt দেখুন)।</p>';
} else {
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  load();
}

async function load(){
  const {data,error}=await sb.from("apps").select("*").eq("published",true).order("created_at",{ascending:false});
  if(error){ app.innerHTML='<p class="empty">লোড করা যায়নি। ইন্টারনেট চেক করে আবার চেষ্টা করুন।</p>'; return; }
  APPS=data; route();
}

function icon(a){
  const l=esc([...a.name][0]||"?");
  return `<div class="ico" style="background:${colorOf(a)}"><span>${l}</span>${a.icon_url?`<img src="${esc(a.icon_url)}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`;
}
const tile = a => `<button class="tile" data-id="${a.id}">${icon(a)}<div class="nm">${esc(a.name)}</div><div class="sz">${a.rating?bn(a.rating)+" ★":""}</div></button>`;
const row = (a,i) => `<button class="row" data-id="${a.id}">${i?`<span class="pos">${bn(i)}</span>`:""}${icon(a)}<div><div class="t">${esc(a.name)}</div><div class="m">${esc(a.category)} &nbsp;★ ${bn(a.rating)} &nbsp;${bn(esc(a.size))}</div></div></button>`;

function home(filter=""){
  document.body.classList.remove("detail");
  const f=filter.trim().toLowerCase();
  if(!APPS.length){ app.innerHTML='<p class="empty">এখনও কোনো সফটওয়্যার যোগ করা হয়নি।</p>'; return; }
  if(f){
    const res=APPS.filter(a=>(a.name+" "+a.category+" "+a.developer).toLowerCase().includes(f));
    app.innerHTML=`<div class="sec"><div class="sec-head"><h2>সার্চ রেজাল্ট</h2></div>`+
      (res.length?`<div class="rowlist">${res.map(a=>row(a)).join("")}</div>`:`<p class="empty">কিছু পাওয়া যায়নি।</p>`)+`</div>`;
    return;
  }
  let html=`<section class="sec"><div class="sec-head"><h2>নতুন সংযোজন</h2></div><div class="rail">${APPS.slice(0,10).map(tile).join("")}</div></section>`;
  const cats=[...new Set(APPS.map(a=>a.category))];
  cats.forEach(c=>{
    html+=`<section class="sec"><div class="sec-head"><h2>${esc(c)}</h2></div><div class="rail">${APPS.filter(a=>a.category===c).map(tile).join("")}</div></section>`;
  });
  const top=[...APPS].sort((a,b)=>b.downloads-a.downloads).slice(0,10);
  html+=`<section class="sec"><div class="sec-head"><h2>টপ ডাউনলোড</h2></div><div class="rowlist">${top.map((a,i)=>row(a,i+1)).join("")}</div></section>`;
  app.innerHTML=html;
}

function detail(id){
  const a=APPS.find(x=>x.id===id);
  if(!a){ location.hash=""; return; }
  document.body.classList.add("detail"); window.scrollTo(0,0);
  const shots=(a.screenshots||[]).map((s,i)=>`<img class="shot-img" src="${esc(s)}" alt="স্ক্রিনশট ${bn(i+1)}" loading="lazy" tabindex="0" data-shot="${esc(s)}">`).join("");
  app.innerHTML=`
    <div class="d-top">${icon(a)}<div><h1>${esc(a.name)}</h1><div class="dev">${esc(a.developer)}</div></div></div>
    <div class="facts">
      <div class="fact"><b>${bn(a.rating)} ★</b><small>রেটিং</small></div>
      <div class="fact"><b>${bn(esc(a.size)||"—")}</b><small>সাইজ</small></div>
      <div class="fact"><b>${bn(esc(a.version)||"—")}</b><small>ভার্সন</small></div>
      <div class="fact"><b>${bn(a.downloads)}</b><small>ডাউনলোড</small></div>
    </div>
    <button class="install" id="install"><span class="fill"></span><span class="lbl">ডাউনলোড করুন</span></button>
    <p class="note">ডাউনলোড শেষে ফাইলটি খুলে ইনস্টল করুন।</p>
    ${shots?`<div class="shots">${shots}</div>`:""}
    ${a.description?`<section class="about"><h2>এই সফটওয়্যার সম্পর্কে</h2><p>${esc(a.description)}</p><div class="tags"><span class="tag">${esc(a.category)}</span></div></section>`:""}`;
  $("#install").addEventListener("click",()=>startDownload(a));
}

/* Google Drive শেয়ার লিংক দিলে সেটা সরাসরি ডাউনলোড লিংকে বদলে নেয়
   (জিমেইল সিলেক্ট বা প্রিভিউ পেজ ছাড়াই ডাউনলোড শুরু হয়) */
function directLink(u){
  const m=String(u).match(/drive\.google\.com\/file\/d\/([\w-]+)/)
        ||String(u).match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/)
        ||String(u).match(/drive\.usercontent\.google\.com\/download\?(?:[^#]*&)?id=([\w-]+)/);
  return m?`https://drive.usercontent.google.com/download?id=${m[1]}&export=download&confirm=t`:u;
}

function startDownload(a){
  if(!a.file_url){ toast("এই সফটওয়্যারের ডাউনলোড লিংক পাওয়া যায়নি।"); return; }
  const btn=$("#install"),fill=btn.querySelector(".fill"),lbl=btn.querySelector(".lbl");
  btn.disabled=true; let p=0;
  const t=setInterval(()=>{
    p+=Math.random()*18+7; if(p>100)p=100;
    fill.style.width=p+"%"; lbl.textContent=`ডাউনলোড হচ্ছে… ${bn(Math.round(p))}%`;
    if(p>=100){
      clearInterval(t);
      const l=document.createElement("a"); l.href=directLink(a.file_url); l.download=a.name; l.rel="noopener";
      document.body.appendChild(l); l.click(); l.remove();
      sb.rpc("add_download",{app_id:a.id}).then(()=>{ a.downloads++; });
      lbl.textContent="ডাউনলোড সম্পন্ন"; toast("ডাউনলোড শুরু হয়েছে।");
      setTimeout(()=>{btn.disabled=false;fill.style.width="0";lbl.textContent="আবার ডাউনলোড করুন"},2500);
    }
  },160);
}

let tt; function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}

const lb=document.createElement("div");
lb.className="lb"; lb.innerHTML='<button aria-label="বন্ধ করুন">×</button><img alt="">';
document.body.appendChild(lb);
const closeLb=()=>lb.classList.remove("on");
lb.addEventListener("click",closeLb);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLb(); });
function openShot(src){ lb.querySelector("img").src=src; lb.classList.add("on"); }

function route(){
  const h=location.hash.replace("#","");
  if(h.startsWith("app/")) detail(h.slice(4)); else home($("#q").value);
}
app.addEventListener("click",e=>{
  const s=e.target.closest("[data-shot]"); if(s){ openShot(s.dataset.shot); return; }
  const b=e.target.closest("[data-id]"); if(b) location.hash="app/"+b.dataset.id;
});
app.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const s=e.target.closest("[data-shot]"); if(s) openShot(s.dataset.shot); } });
$("#back").addEventListener("click",()=>{ history.length>1?history.back():(location.hash=""); });
$("#q").addEventListener("input",()=>{ if(location.hash) location.hash=""; else home($("#q").value); });
window.addEventListener("hashchange",()=>{ if(APPS.length||!SUPABASE_URL.includes("YOUR-PROJECT")) route(); });
</script>
</body>
</html>
